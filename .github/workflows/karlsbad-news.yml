name: Karlsbad News aktualisieren

on:
  schedule:
    - cron: "17 4 * * *" # täglich 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: karlsbad-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Artikel abrufen
        run: python3 -I _tools/karlsbad-news/scrape.py
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karlsbad-news/
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Karlsbad News: Daten aktualisiert"
            git push
          fi
